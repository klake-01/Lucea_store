<!doctype html>
<html lang="fr-MA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efe6" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://luceamaroc.com/" />

    <!-- Defaults. Replaced per route at runtime by src/lib/seo.ts and at build
         time by scripts/prerender.ts, so every page ships one canonical,
         one title, one description and one keywords tag. -->
    <title>Veilleuses prenom et lampes 3D | LUCEA Maroc</title>
    <meta
      name="description"
      content="Veilleuses gravees au prenom et lampes design imprimees en 3D au Maroc. Livraison en 24h a Casablanca et Rabat, paiement a la livraison."
    />
    <meta
      name="keywords"
      content="veilleuse prenom bebe, lampe personnalisee maroc, lampe 3d maroc, luminaire design maroc"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="LUCEA Maroc" />

    <meta property="og:site_name" content="LUCEA Maroc" />
    <meta property="og:locale" content="fr_MA" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Product imagery is served from Unsplash, so the handshake starts early -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!--
      Only the weights actually used ship: Fraunces 600/700 for headings and
      Inter 400/500/600/700 for UI. display=swap renders text immediately in
      the fallback rather than holding the first paint.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
