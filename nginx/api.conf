# API-only edge, for the split deployment:
#   Vercel  -> the storefront (built and served from the repo)
#   Ubuntu  -> this nginx, the FastAPI app, and every datastore
#
# Use this when Vercel serves the frontend. Use nginx/nginx.conf instead when
# the Ubuntu box serves everything (the `selfhosted` compose profile).
#
# The difference is deliberate and small: no `root`, no `try_files`, no static
# caching rules. Serving a copy of the frontend here as well would mean two
# origins with the same pages, which is a duplicate-content problem and a
# second thing to keep in sync.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Security headers. Note there is no Content-Security-Policy here: this
    # origin serves JSON, not documents, and the storefront's CSP is set by
    # Vercel in vercel.json.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/xml text/plain;

    # Edge rate limits, applied before a request reaches the API
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=240r/m;

    server {
        listen 80;
        # Replace with your API hostname. It must match the host in
        # vercel.json's /api rewrite and in the certificate.
        server_name api.luceamaroc.com;

        # Let's Encrypt HTTP-01 challenge has to stay reachable over plain
        # HTTP, so it is matched before the redirect below.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else goes to HTTPS. The storefront is served over HTTPS by
        # Vercel; a plain-HTTP API would be blocked by the browser as mixed
        # content, so this redirect is not optional.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        # Enable this block only after certbot has issued the certificate,
        # otherwise nginx fails to start on the missing files.
        listen 443 ssl;
        http2 on;
        server_name api.luceamaroc.com;

        ssl_certificate     /etc/letsencrypt/live/api.luceamaroc.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.luceamaroc.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/v1/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://api:8000/api/v1/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded product and article images are served by the API from MinIO.
        location /health { proxy_pass http://api:8000/health; }

        # Operational and schema endpoints stay off the public surface.
        location /metrics { deny all; return 404; }
        location /docs    { deny all; return 404; }
        location /redoc   { deny all; return 404; }

        # This origin has no pages.
        location / { return 404; }
    }
}
