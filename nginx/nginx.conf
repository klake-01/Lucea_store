worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy.
    # script-src has no 'unsafe-inline': the Vite build emits external module
    # scripts only, so inline script injection is blocked outright. That is the
    # main mitigation for a stolen staff token, which lives in sessionStorage.
    # style-src still allows inline because React sets a few element styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/manifest+json;

    # Edge rate limits, applied before a request ever reaches the API
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=240r/m;

    server {
        listen 80;
        server_name localhost;

        # Include generated redirects (if any exist)
        include /usr/share/nginx/html/redirects.conf*;

        location /api/v1/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://api:8000/api/v1/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Operational and schema endpoints stay off the public surface
        location /metrics { deny all; return 404; }
        location /docs    { deny all; return 404; }
        location /redoc   { deny all; return 404; }

        # ---------------------------------------------------------------
        # The storefront itself.
        #
        # Until this block existed, production served the API and nothing
        # else: every non /api/ URL returned 404 because no root was set.
        # ---------------------------------------------------------------
        root /usr/share/nginx/html;
        index index.html;

        # Hashed assets never change contents under the same name.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Images and fonts: long lived but not content hashed, so revalidate.
        location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Generated at build time; must never be cached stale.
        location = /sitemap.xml { add_header Cache-Control "no-cache"; try_files $uri =404; }
        location = /robots.txt  { add_header Cache-Control "no-cache"; try_files $uri =404; }

        location / {
            # The order matters and is the whole point of prerendering.
            #   $uri              a real file
            #   $uri/index.html   the PRERENDERED shell for this route, which
            #                     carries that page's own title, description,
            #                     canonical and JSON-LD
            #   /index.html       the SPA fallback, generic metadata
            # Dropping the middle term would still render the site correctly
            # for humans while serving every crawler the home page's metadata.
            try_files $uri $uri/index.html /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
