services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_prod_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      # Without this the production guards in app/config.py stay inactive:
      # a weak JWT secret would be accepted, /docs would stay open and HSTS
      # would never be sent.
      - ENVIRONMENT=production
      - CORS_ORIGINS=${CORS_ORIGINS}
      - METRICS_ALLOWED_TOKEN=${METRICS_ALLOWED_TOKEN}
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:1.24.2
    restart: always
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.28.0
    restart: always
    # Not published either. Reach it over an SSH tunnel when needed.
    expose:
      - "8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  prometheus:
    image: prom/prometheus:latest
    restart: always
    # Deliberately not published. Scraping is internal to the compose network,
    # and /metrics itself requires METRICS_ALLOWED_TOKEN.
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  # The storefront and the edge are one image: nginx, the nginx config, and
  # the built SPA including every prerendered route shell.
  #
  # This replaces the previous bare nginx service, which mounted the config
  # but had no files to serve — production answered /api/ and 404'd every
  # page. Two nginx containers would also fight over port 80.
  # ---------------------------------------------------------------------
  # DEFAULT (Vercel serves the storefront): api-edge terminates TLS for
  # api.<domain> and proxies to the API. No frontend is built here.
  # ---------------------------------------------------------------------
  api-edge:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/api.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # OPTIONAL (Ubuntu serves everything, no Vercel). Opt in with:
  #   docker compose -f docker-compose.prod.yml --profile selfhosted up -d
  # Start api-edge OR web, never both: they contend for ports 80 and 443.
  # ---------------------------------------------------------------------
  web:
    profiles: ["selfhosted"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same origin: nginx proxies /api/ to the api service.
        VITE_API_URL: ""
        # The prerenderer reads published articles from the API during the
        # build, so it must be reachable by service name at that moment.
        BLOG_API_URL: "http://api:8000/api/v1"
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # CLOUDFLARE TUNNEL (Expose API to HTTPS domain without public IP/certbot)
  # Set CLOUDFLARE_TUNNEL_TOKEN in your .env file to enable.
  # ---------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  meilisearch_prod_data:
